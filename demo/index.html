    />
    <title>Ogma Annotations</title>
    <script type="module" crossorigin src="./assets/index-v1pyzKtf.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/brand-_lt4a57M.js">
    <link rel="modulepreload" crossorigin href="./assets/rgba-DYVNydSt.js">
    <link rel="modulepreload" crossorigin href="./assets/ui-styles-7oxClV1h.js">
    <link rel="stylesheet" crossorigin href="./assets/brand-Brko1__D.css">
    <link rel="stylesheet" crossorigin href="./assets/lock-toolbar-item-DHQQkdOG.css">

  </head>

  <body>
    <div class="body">
      <div class="left"></div>
      <div id="app"></div>
    </div>
    <!-- SVG Export Popup -->
    <div id="svg-popup" class="popup-backdrop" style="display: none">
      <div class="popup-content">
        <div class="popup-header">
          <h2>SVG Export Preview</h2>
          <button id="popup-close" class="popup-close">&times;</button>
        </div>
        <div class="popup-body">
          <div id="svg-preview"></div>
        </div>
        <div class="popup-footer">
          <button class="popup-button">Download SVG</button>
        </div>
      </div>
    </div>
    <div id="json-popup" class="popup-backdrop" style="display: none">
      <div class="popup-content">
        <div class="popup-header">
          <h2>JSON Export Preview</h2>
          <button id="popup-close" class="popup-close">&times;</button>
        </div>
        <div class="popup-body">
          <pre><code id="json-preview"></code></pre>
        </div>
        <div class="popup-footer">
          <button class="popup-button">Download JSON</button>
        </div>
      </div>
    </div>
    <!-- The drawing/undo-redo toolbar (add arrow/comment/box/text/polygon,
         undo/redo, delete, export) is now mounted by `AnnotationToolbar`
         from `@linkurious/ogma-annotations/ui` - see main.ts. -->
    <div class="control-bar vertical" id="vis-controls">
      <button id="center-view" tooltip="Center view">
        <i class="icon-minimize"></i>
      </button>
      <span class="separator"></span>
      <button id="rotate-cw" tooltip="rotate clockwise">
        <i class="icon-rotate-cw"></i>
      </button>
      <button id="rotate-ccw" tooltip="rotate counter-clockwise">
        <i class="icon-rotate-ccw"></i>
      </button>
    </div>
    <!-- The style panel is now mounted by `AnnotationPanel` from
         `@linkurious/ogma-annotations/ui` - see main.ts. -->
  </body>
</html>
