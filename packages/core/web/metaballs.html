<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Metaball region spike</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0e1116;
        cursor: grab;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(20, 22, 28, 0.85);
        color: #ddd;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.6;
        width: 260px;
      }
      #panel label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #panel input[type="range"] {
        width: 130px;
      }
      #panel button {
        margin: 4px 4px 0 0;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      #panel .row {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="panel">
      <div class="row"><b>Metaball region spike</b> (#134)</div>
      <div class="row">Drag balls. Compare old straight-corridor bridging
      vs metaball wasp-waist connectors after a simulated layout jump.</div>
      <label class="row">spread (v) <span id="spreadVal"></span>
        <input id="spread" type="range" min="0" max="1" step="0.01" />
      </label>
      <label class="row">handle size <span id="handleVal"></span>
        <input id="handle" type="range" min="0.5" max="4" step="0.05" />
      </label>
      <label class="row">connect threshold ×r <span id="threshVal"></span>
        <input id="thresh" type="range" min="1" max="4" step="0.05" />
      </label>
      <div class="row">
        <button id="btnScatter">Simulate layout jump</button>
        <button id="btnReset">Reset</button>
        <button id="btnAdd">Add ball</button>
      </div>
      <div class="row">
        <label><input id="toggleOld" type="checkbox" /> show old straight corridor</label>
      </div>
      <div class="row">
        <label><input id="toggleBlob" type="checkbox" checked /> show metaball blob</label>
      </div>
    </div>
    <script type="module" src="./metaballs.ts"></script>
  </body>
</html>
