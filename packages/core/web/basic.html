<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@linkurious/ogma-annotations@2.0.2/dist/ogma-annotations.css"
    />
    <style>
      #graph-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
      }
      #enable,
      #link-edge {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
      }
      #link-edge {
        left: 80px;
      }
      #status {
        position: absolute;
        top: 130px;
        left: 20px;
        z-index: 1000;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="graph-container"></div>
    <button id="enable">enable</button>
    <button id="link-edge">link to edge</button>
    <span id="status"></span>
    <script type="module" src="basic.ts"></script>
  </body>
</html>
