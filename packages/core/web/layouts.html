<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #graph-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
      }
      #panel {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #panel button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
      }
      #panel button:hover {
        background: #ececec;
      }
      #panel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="graph-container"></div>
    <div id="panel">
      <button id="hierarchical">Hierarchical layout</button>
      <button id="force">Force layout</button>
      <span id="status">7 nodes, 1 comment each</span>
    </div>
    <script type="module" src="layouts.ts"></script>
  </body>
</html>
